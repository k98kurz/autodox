[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autodox"
version = "0.2.0"
authors = [
  { name="k98kurz", email="k98kurz@gmail.com" },
]
description = "Tool for generating documentation automatically from code annotations, types, and docstrings."
readme = "readme.md"
license = "ISC"
license-files = ["license"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Documentation"
]

[project.urls]
"Homepage" = "https://github.com/k98kurz/autodox"
"Repository" = "https://github.com/k98kurz/autodox"
"Bug Tracker" = "https://github.com/k98kurz/autodox/issues"

[project.scripts]
autodox = "autodox.cli:main_cli"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["autodox"]

[tool.hatch.build.targets.sdist]
only-include = [
  "autodox",
  "changelog.md",
  "readme.md",
  "docs/dox.md",
  "scripts/hatch_build.py",
]
